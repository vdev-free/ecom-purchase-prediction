name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install ruff pytest httpx
          pip install fastapi uvicorn joblib pandas numpy scikit-learn

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest

      - name: Docker build
        run: docker build -t ecom-api:ci .
